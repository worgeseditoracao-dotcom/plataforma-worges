<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Projetos editoriais · Worges</title><style>*{box-sizing:border-box}body{margin:0;background:#edf4f5;color:#163947;font:16px/1.5 system-ui}header{background:#123747;color:white;padding:22px max(5vw,16px);display:flex;align-items:center;justify-content:space-between}main{max-width:1100px;margin:32px auto;padding:0 18px}section,details,article{background:white;padding:clamp(16px,3vw,30px);border:1px solid #cadae0;border-radius:12px;margin:16px 0}h1,h2{font-family:Georgia,serif}input,textarea,button,select{font:inherit;padding:10px;border:1px solid #9db3bd;border-radius:6px}button{background:#12576a;color:white;cursor:pointer}label{display:grid;gap:4px}form{display:grid;gap:14px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(210px,100%),1fr));gap:14px}summary{cursor:pointer;font-weight:700}article{overflow-wrap:anywhere}a{color:#11677b}header a{color:white}ul{padding-left:20px}li{margin:8px 0}li button{margin-left:10px}#msg{white-space:pre-line}[hidden]{display:none!important}</style></head><body><header><b>WORGES · EDITORAÇÃO</b><a href="/">Página inicial</a></header><main><h1 id="heading"></h1><p id="msg" role="status"></p><section id="auth"><form id="login"><label>E-mail<input name="email" required type="email" autocomplete="username"></label><label>Senha<input name="password" type="password" required minlength="8" autocomplete="current-password"></label><div><button>Entrar</button> <button type="button" id="signup">Criar acesso</button></div></form></section><div hidden id="desk"><button id="logout">Sair</button><div id="manager" hidden><h2>Relatório de projetos</h2><p id="report"></p><details id="editor"><summary>Cadastrar ou editar projeto</summary><form id="project"><div class="grid" id="fields"></div><div><button>Salvar projeto</button> <button type="button" id="reset">Limpar</button></div></form></details></div><label>Buscar por obra, autor, contato ou pacote<input id="search" type="search"></label><div id="list"></div></div></main><script src="/gestao.js"></script></body></html>
